name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Alexandria

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Alexandria/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      # Run every check after a successful install, even if another check fails.
      # Failed checks still fail the required verify job.
      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Production build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
